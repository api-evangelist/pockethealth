name: PocketHealth
kind: company
description: PocketHealth is a patient-centric medical imaging platform that lets
  patients access, view, store, and share their diagnostic imaging (DICOM) and
  reports online, and lets healthcare providers exchange imaging across
  institutions and networks. PocketHealth also publishes an open, RESTful
  developer API aimed at RIS/PACS/VNA vendors, letting them embed PocketHealth's
  patient enrollment, electronic consent, and background record-delivery
  workflows natively into their own clinical software. The developer API is
  partner-gated - it is free forever for RIS/PACS vendors, healthcare providers,
  and physicians, but the full technical reference (base URL, endpoint paths,
  authentication) is not published on the open web; engaged vendors are assigned
  a dedicated integration rep who provides testing resources and detailed
  documentation. As a result the APIs below are modeled from PocketHealth's
  public developer-program descriptions rather than a public API reference or
  OpenAPI definition.
